<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title> Nueva Pestaña </title>
  <link id="mi-favicon" rel="icon" type="image/png" href="images/icons/icono_1.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- BOTÓN PARA OCULTAR/MOSTRAR CONTENIDO -->
  <button id="btn-toggle-contenido" class="btn-toggle-contenido" title="Ocultar contenido"
    aria-label="Ocultar o mostrar contenido">
    <svg class="icono-ojo-abierto" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    <svg class="icono-ojo-cerrado" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
      </path>
      <line x1="1" y1="1" x2="23" y2="23"></line>
    </svg>
  </button>

  <div class="buscador-google">
    <img src="images/logo/guguel_logo.png" alt="Google logo" class="logo">

    <div class="contenedor-interactivo">
      <form action="https://www.google.com/search" method="get">
        <input type="text" name="q" class="barra-busqueda" placeholder="Busca en Guguel..." autofocus
          autocomplete="off">
      </form>
    </div>

  </div>

  <!-- ACCESOS DIRECTOS CON PAGINACIÓN -->
  <div class="accesos-directos">
    <div class="paginas-wrapper">
      <!-- PÁGINA 1: GENERAL -->
      <div class="pagina-accesos activa" data-pagina-index="0">
        <a href="https://www.youtube.com" class="acceso-item acceso-youtube" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
            </svg>
          </div>
          <span class="acceso-texto">YouTube</span>
        </a>

        <a href="https://github.com" class="acceso-item acceso-github" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
          </div>
          <span class="acceso-texto">GitHub</span>
        </a>

        <a href="https://mail.google.com" class="acceso-item acceso-gmail" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
            </svg>
          </div>
          <span class="acceso-texto">Gmail</span>
        </a>

        <a href="https://outlook.live.com" class="acceso-item acceso-outlook" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M7.88 12.04q0 .45-.11.89-.1.43-.33.8-.22.38-.57.65-.34.28-.84.45-.49.18-1.14.18-.84 0-1.48-.31-.63-.3-.98-.82-.35-.51-.35-1.22 0-.68.32-1.22.33-.53.94-.85.62-.32 1.48-.32.65 0 1.16.18.52.17.88.46.36.28.58.68.23.4.23.87zm-1.84.05q0-.39-.14-.68-.13-.28-.38-.45-.25-.16-.62-.16-.36 0-.62.16-.25.17-.39.45-.14.29-.14.68 0 .39.14.67.14.29.39.46.26.16.62.16.37 0 .62-.16.25-.17.38-.46.14-.28.14-.67zm16.46 3.99v-8.3q0-.73-.42-1.27-.41-.55-1.08-.73l-6.85-2.05q-.41-.12-.87-.12-.45 0-.87.12l-6.85 2.05q-.67.18-1.08.73-.42.54-.42 1.27v8.3q0 .74.42 1.28.41.54 1.08.72l6.85 2.05q.42.13.87.13.46 0 .87-.13l6.85-2.05q.67-.18 1.08-.72.42-.54.42-1.28zm-1.85-.35-5.91-3.95v-7.39l5.91 1.77zm-7.76-3.95-5.91 3.95v-9.57l5.91-1.77zm-.92 1.3-4.99-3.33 4.99-1.5 4.99 1.5z" />
            </svg>
          </div>
          <span class="acceso-texto">Outlook</span>
        </a>

        <a href="https://gemini.google.com" class="acceso-item acceso-gemini" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M12 2C12 7.523 7.523 12 2 12C7.523 12 12 16.477 12 22C12 16.477 16.477 12 22 12C16.477 12 12 7.523 12 2Z" />
            </svg>
          </div>
          <span class="acceso-texto">Gemini</span>
        </a>

        <a href="https://copilot.microsoft.com" class="acceso-item acceso-copilot" target="_blank"
          rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M19.49 14.51a5.1 5.1 0 0 1-5.1 5.1H8.79a5.1 5.1 0 0 1-5.1-5.1 5.1 5.1 0 0 1 2.37-4.32A5.1 5.1 0 0 1 11.1 5.1h5.6a5.1 5.1 0 0 1 5.1 5.1 5.1 5.1 0 0 1-2.31 4.31zm-1.89-4.31a3.21 3.21 0 0 0-3.21-3.21h-5.6a3.21 3.21 0 0 0-3.21 3.21 3.21 3.21 0 0 0 1.49 2.72l.35.21-.24.33a3.21 3.21 0 0 0-.5 1.75 3.21 3.21 0 0 0 3.21 3.21h5.6a3.21 3.21 0 0 0 3.21-3.21 3.21 3.21 0 0 0-1.49-2.72l-.35-.21.24-.33a3.21 3.21 0 0 0 .5-1.75z" />
            </svg>
          </div>
          <span class="acceso-texto">Copilot</span>
        </a>

        <a href="https://web.whatsapp.com" class="acceso-item acceso-whatsapp" target="_blank"
          rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.04 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 15 3.8 13.47 3.8 11.91C3.81 7.37 7.5 3.67 12.05 3.67Z" />
            </svg>
          </div>
          <span class="acceso-texto">WhatsApp</span>
        </a>

        <a href="https://drive.google.com/file/d/18ggz6IcUiSusRKI1mAk-DoWeCJj9dCg7/view" class="acceso-item acceso-horario" target="_blank"
          rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z" />
            </svg>
          </div>
          <span class="acceso-texto">Horario</span>
        </a>
      </div>

      <!-- PÁGINA 2: CLASES / HORARIO VIRTUAL -->
      <div class="pagina-accesos" data-pagina-index="1">
        <a href="https://meet.google.com" class="acceso-item acceso-meet" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 3.5V7l-4 3.5z" />
            </svg>
          </div>
          <span class="acceso-texto">Meet</span>
        </a>

        <a href="https://teams.microsoft.com" class="acceso-item acceso-teams" target="_blank"
          rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M19.5 7.5a2.5 2.5 0 1 0-2.5-2.5 2.5 2.5 0 0 0 2.5 2.5zm-5 0A2.5 2.5 0 1 0 12 5a2.5 2.5 0 0 0 2.5 2.5zm5 2h-2a2 2 0 0 0-.8.17 3.5 3.5 0 0 1 2.8 3.33v2h2a1 1 0 0 0 1-1v-2.5a2 2 0 0 0-3-2zm-5 0H12a3 3 0 0 0-3 3v3a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3a3 3 0 0 0-3.5-3zM8 9H3a1 1 0 0 0-1 1v2.5a3 3 0 0 0 3 3h3v-2H5a1 1 0 0 1-1-1V11h4z" />
            </svg>
          </div>
          <span class="acceso-texto">Teams</span>
        </a>

        <a href="https://zoom.us/join" class="acceso-item acceso-zoom" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M4.5 7h9a2.5 2.5 0 0 1 2.5 2.5v5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 2 14.5v-5A2.5 2.5 0 0 1 4.5 7zm13.25 2.625l3.25-2.125a.75.75 0 0 1 1.15.625v7.75a.75.75 0 0 1-1.15.625l-3.25-2.125v-4.75z" />
            </svg>
          </div>
          <span class="acceso-texto">Zoom</span>
        </a>

        <a href="https://classroom.google.com" class="acceso-item acceso-classroom" target="_blank"
          rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6l-1 2h-2l1-2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm7 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-4 7h8a2 2 0 0 0-2-2H10a2 2 0 0 0-2 2z" />
            </svg>
          </div>
          <span class="acceso-texto">Classroom</span>
        </a>

        <a href="https://meet.google.com" class="acceso-item acceso-clase1" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H8v-2h2V7h2v4h2v2h-2v4zm5-8h-3V7h3v2z" />
            </svg>
          </div>
          <span class="acceso-texto">Clase 1</span>
        </a>

        <a href="https://meet.google.com" class="acceso-item acceso-clase2" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" />
            </svg>
          </div>
          <span class="acceso-texto">Clase 2</span>
        </a>

        <a href="https://meet.google.com" class="acceso-item acceso-clase3" target="_blank" rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M9 3v2.5a5.5 5.5 0 0 0-1.5 3.9c0 1.6.7 3.1 1.9 4.1L6 19a2 2 0 0 0 1.6 3h8.8a2 2 0 0 0 1.6-3l-3.4-5.5a5.5 5.5 0 0 0 1.9-4.1c0-1.5-.6-3-1.5-3.9V3H9zm2 2h2v3h-2V5z" />
            </svg>
          </div>
          <span class="acceso-texto">Clase 3</span>
        </a>

        <a href="https://calendar.google.com" class="acceso-item acceso-aulavirtual" target="_blank"
          rel="noopener noreferrer">
          <div class="acceso-icono">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path
                d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 14.5l-7-3.82v3.82c0 2.21 3.13 4 7 4s7-1.79 7-4v-3.82l-7 3.82z" />
            </svg>
          </div>
          <span class="acceso-texto">Aula Virtual</span>
        </a>
      </div>
    </div>

    <!-- BOTONES DE PAGINACIÓN -->
    <div class="paginacion-accesos">
      <button id="btn-pagina-prev" class="btn-pagina-nav" title="Página anterior" aria-label="Página anterior">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
        </svg>
      </button>
      <div class="pills-paginacion">
        <button class="pill-pagina activa" data-ir-pagina="0">
          <span>General</span>
        </button>
        <button class="pill-pagina" data-ir-pagina="1">
          <span>Clases</span>
        </button>
      </div>
      <button id="btn-pagina-next" class="btn-pagina-nav" title="Página siguiente" aria-label="Página siguiente">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
        </svg>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
